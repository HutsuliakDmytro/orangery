[workspace]
members = ["apps/*/src-tauri", "crates/*", "packages/tauri-shared"]
resolver = "2"

# Shared by every crate in the workspace: an app that disagrees with one of
# these is saying something, and having to write it down is the point.
[workspace.package]
version = "0.1.0"
authors = ["Dmytro Hutsuliak <dmytro.hutsuliak.dev@gmail.com>"]
license = "MIT"
repository = "https://github.com/HutsuliakDmytro/orangery"
edition = "2021"
rust-version = "1.77.2"

# Cargo reads profiles from the workspace root only — a `[profile]` in a member
# manifest is ignored with a warning, so these live here for every app.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
