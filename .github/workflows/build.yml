name: build

on:
  pull_request:
  push:
    branches: [main]
    # A tag builds the same way and then publishes what it built.
    tags: ['v*']

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the state of the others.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS universal (unsigned)
            target: universal-apple-darwin
            bundles: app,dmg
          - os: ubuntu-latest
            label: Linux
            target: ''
            bundles: deb,appimage
          - os: windows-latest
            label: Windows
            target: ''
            bundles: nsis

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # Signing and notarization land in Phase 5; this only proves the app builds.
      - run: pnpm tauri build ${{ matrix.target && format('--target {0}', matrix.target) || '' }} --bundles ${{ matrix.bundles }}
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: orangery-docs-${{ matrix.os }}
          path: |
            src-tauri/target/*/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: warn

  release:
    name: release
    needs: build
    # Only a tag publishes. Every other build proves the app compiles and stops
    # there.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true

      # Marked as a pre-release: nothing here is signed or notarized yet, so
      # macOS and Windows will both warn before running it.
      - run: |
          # Read into an array rather than substituted into the command line:
          # the installers have a space in their name, and word splitting turns
          # each of them into two paths that do not exist.
          mapfile -t assets < <(
            find bundles -type f \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.exe' \)
          )

          printf 'attaching %s\n' "${assets[@]}"

          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --prerelease \
            --generate-notes \
            "${assets[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
