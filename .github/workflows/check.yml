name: check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: lint + typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The root script formats-checks the workspace and then runs every
      # package's own `check`, which is what a person runs locally too.
      - run: pnpm check

  e2e:
    name: end-to-end (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The webview differs per platform (WKWebView, WebView2, WebKitGTK), and
        # so does the modifier key, so the suite runs on all three.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install chromium --with-deps

      # These run against the Vite dev server. `tauri-driver` supports Linux and
      # Windows only — macOS is a TODO in its own README — so the shell-level
      # suite is a separate job rather than the same one on every platform.
      - run: pnpm --filter docs test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}
          path: apps/docs/playwright-report
          if-no-files-found: ignore

  render-diff:
    name: round-trip render diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LibreOffice and poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Structural XML equality is necessary but not sufficient: meaning lives in
      # styles.xml and numbering.xml too. This renders each corpus file before and
      # after a round-trip and compares the pages.
      - run: pnpm --filter docs test:render

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: render-diffs
          path: apps/docs/test-results/render-diff
          if-no-files-found: ignore

  rust:
    name: clippy + cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # One cargo workspace at the root, so every app's crate is covered by a
      # single run and a single cache.
      - uses: swatinem/rust-cache@v2

      - run: cargo fmt --all --check

      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo test
