name: build

on:
  pull_request:
  push:
    branches: [main]
    # Each app releases on its own tag, so a fix in Docs never ships a version
    # bump for Slides. A tag builds the same way and then publishes what it built.
    tags: ['docs-v*', 'slides-v*']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.app }} — ${{ matrix.platform.label }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      # One platform failing should not hide the state of the others.
      fail-fast: false
      matrix:
        # Adding an app to the suite is adding it to this list.
        app: [docs]
        platform:
          - os: macos-latest
            label: macOS universal (unsigned)
            target: universal-apple-darwin
            bundles: app,dmg
          - os: ubuntu-latest
            label: Linux
            target: ''
            bundles: deb,appimage
          - os: windows-latest
            label: Windows
            target: ''
            bundles: nsis

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      # Signing and notarization land in Phase 5; this only proves the app builds.
      - run: pnpm --filter ${{ matrix.app }} tauri build ${{ matrix.platform.target && format('--target {0}', matrix.platform.target) || '' }} --bundles ${{ matrix.platform.bundles }}
        shell: bash

      # One cargo workspace, so the bundles land in the target directory at the
      # repository root rather than under the app.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-${{ matrix.platform.os }}
          path: |
            target/*/release/bundle/**/*.dmg
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.exe
          if-no-files-found: warn

  release:
    name: release
    needs: build
    # Only a tag publishes. Every other build proves the app compiles and stops
    # there.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # `docs-v0.1.0` releases Docs. Downloading only that app's artifacts is
      # what keeps a tag from shipping a sibling app that merely built alongside.
      - id: app
        run: echo "name=${GITHUB_REF_NAME%%-v*}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ steps.app.outputs.name }}-*
          path: bundles
          merge-multiple: true

      # Marked as a pre-release: nothing here is signed or notarized yet, so
      # macOS and Windows will both warn before running it.
      - run: |
          # Read into an array rather than substituted into the command line:
          # the installers have a space in their name, and word splitting turns
          # each of them into two paths that do not exist.
          mapfile -t assets < <(
            find bundles -type f \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.exe' \)
          )

          printf 'attaching %s\n' "${assets[@]}"

          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --prerelease \
            --generate-notes \
            "${assets[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
