[package]
name = "orangery-docs"
version = "0.1.0"
description = "Orangery Docs — desktop word processor"
authors = ["Dmytro"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "orangery_docs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-fs = "2.5.2"
sha2 = "0.10.9"
tokio = { version = "1.53.1", features = ["time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
