<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Orangery Sheets.

    The same family as Docs and Slides: a black tile, an orange sun behind, a
    white sheet in front. What differs is the only thing that should. Docs has
    lines of text, Slides has a landscape sheet with a title on it, and this
    has a grid, because a grid is what a spreadsheet is and nothing else in the
    suite has one.

    Four cells rather than forty: at 32 pixels a real grid turns to grey, and
    what has to survive is the idea of a grid rather than a count of rows. The
    one filled cell is where every spreadsheet starts.

    Source of truth for every other file in this directory; `pnpm icon` in this
    app regenerates the lot from it, straight from this SVG.

    Note for anyone editing: a double hyphen is not allowed inside an XML
    comment. A browser will forgive it and the icon generator will not, which
    is exactly the order you do not want to find out in.
  -->
  <rect width="1024" height="1024" rx="230" fill="#0B0B0B"/>
  <circle cx="706" cy="322" r="176" fill="#FF7A00"/>

  <g>
    <rect x="160" y="400" width="608" height="464" rx="34" fill="#F5F5F5"/>

    <!-- The header row, which every sheet is read from. -->
    <rect x="160" y="400" width="608" height="96" rx="34" fill="#FF7A00"/>
    <rect x="160" y="462" width="608" height="34" fill="#FF7A00"/>

    <!-- Two lines each way: a grid, at the size a grid stops being one. -->
    <g fill="#0B0B0B" opacity="0.18">
      <rect x="160" y="620" width="608" height="14"/>
      <rect x="160" y="744" width="608" height="14"/>
      <rect x="356" y="496" width="14" height="368"/>
      <rect x="558" y="496" width="14" height="368"/>
    </g>

    <!-- The first cell, filled: where a spreadsheet starts. -->
    <rect x="196" y="536" width="126" height="58" rx="10" fill="#FF7A00" opacity="0.55"/>
  </g>
</svg>
